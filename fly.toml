app = "macro-intelligence"
primary_region = "gru"

[build]

[env]
  LOG_LEVEL = "INFO"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  # Python needs several seconds to import the app before it listens on 8080: give it time
  # before Fly judges the port, then check the page answers
  [[http_service.checks]]
    grace_period = "30s"
    interval = "30s"
    method = "GET"
    path = "/"
    timeout = "10s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"
