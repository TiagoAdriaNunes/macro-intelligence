[project]
name = "macro-intelligence"
version = "0.1.0"
description = "AI-powered macroeconomic research assistant built with Python, Shiny, LangGraph, and OpenRouter."
readme = "README.md"
license = "MIT"
authors = [{ name = "Tiago Adria Nunes" }]
requires-python = ">=3.11"
dependencies = [
    "great-tables>=1.1.0",
    "langchain-core>=1.7.6",
    "langchain-openrouter>=0.2.9",
    "langgraph>=1.2.20",
    "pandas>=3.1.1",
    "pydantic>=2.12.5",
    "python-bcb>=0.4.1",
    "python-dotenv>=1.2.4",
    "requests>=2.34.2",
    "shiny>=1.9.0",
    "shinychat>=0.7.2",
    "wbgapi>=1.0.14",
]

[project.scripts]
macro-intelligence = "macro_intelligence.cli:main"
macro-intelligence-app = "macro_intelligence.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
# Phoenix installs a pytest plugin we don't use; loading it imports Phoenix and its LDAP library,
# which prints deprecation warnings
addopts = "-p no:phoenix"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # Pyflakes
    "I",    # isort (import sorting)
    "B",    # flake8-bugbear
    "UP",   # pyupgrade
    "SIM",  # flake8-simplify
]
ignore = ["E501"]  # the formatter wraps code; long strings and comments are fine

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pyrefly]
# Pyrefly's preset for a project without one is "basic", which hides most type errors
preset = "default"
project-includes = ["src"]  # tests aren't type checked
# Use the project's .venv, even when the editor has another Python selected
python-interpreter-find-command = ["uv", "python", "find"]

[dependency-groups]
dev = [
    "arize-phoenix>=21.0.0",
    "openinference-instrumentation-langchain>=0.1.82",
    "pyrefly>=1.4.1",
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]
